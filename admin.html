<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfficeSmart — ניהול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #17171e;
    --surface2: #1e1e28;
    --border: #2a2a38;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e8e8f0;
    --text-muted: #7878a0;
    --text-dim: #4a4a65;
    --radius: 12px;
    --font: 'Heebo', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ─── Header ─── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo span { font-weight: 300; color: var(--text-muted); -webkit-text-fill-color: var(--text-muted); }

  /* ─── Layout ─── */
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 28px;
  }

  /* ─── Tabs ─── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 6px;
    margin-bottom: 24px;
  }

  .tab {
    flex: 1;
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  /* ─── Cards ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  /* ─── Form ─── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: .4px;
  }

  input, select, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    transition: border-color .2s;
    outline: none;
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea { resize: vertical; min-height: 72px; }

  select option { background: var(--surface2); }

  /* ─── Buttons ─── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .2s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #5a52e0; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid transparent;
    padding: 6px 10px;
    font-size: 13px;
  }

  .btn-danger:hover { background: rgba(239,68,68,.1); }

  .btn-green {
    background: var(--green);
    color: #fff;
  }

  .btn-green:hover { background: #16a34a; }

  /* ─── Properties list ─── */
  .prop-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    max-height: 420px;
    overflow-y: auto;
  }

  .prop-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    transition: border-color .2s;
    cursor: pointer;
  }

  .prop-item:hover { border-color: var(--accent); }

  .prop-item.selected { border-color: var(--accent); background: rgba(108,99,255,.08); }

  .prop-thumb {
    width: 48px;
    height: 36px;
    border-radius: 6px;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 18px;
  }

  .prop-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .prop-info { flex: 1; min-width: 0; }
  .prop-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prop-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .prop-actions { display: flex; gap: 4px; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-yellow { background: rgba(234,179,8,.15); color: #eab308; }

  /* ─── Client panel ─── */
  .client-section { display: flex; flex-direction: column; gap: 20px; }

  .client-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .client-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .client-name { font-size: 15px; font-weight: 700; }
  .client-count { font-size: 12px; color: var(--text-muted); }

  .selection-counter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .counter-num {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent2);
    line-height: 1;
  }

  /* ─── URL output ─── */
  .url-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--text-muted);
    word-break: break-all;
    font-family: monospace;
    max-height: 80px;
    overflow-y: auto;
    line-height: 1.6;
  }

  /* ─── Selected props in client ─── */
  .selected-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }

  .selected-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 13px;
  }

  .remove-sel {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: color .2s;
  }

  .remove-sel:hover { color: var(--red); }

  /* ─── Image URLs ─── */
  .img-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .img-input-row input { flex: 1; }

  /* ─── Empty state ─── */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 500;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ─── Images preview ─── */
  .img-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .img-preview { width: 60px; height: 45px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">Office<span>Smart</span> <span style="font-size:12px;margin-right:8px">פאנל ניהול</span></div>
  <div style="font-size:13px;color:var(--text-muted)">v2.0 — URL Encoded</div>
</header>

<div class="main">
  <!-- ─── LEFT COLUMN ─── -->
  <div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('properties')">🏢 נכסים (<span id="propCount">0</span>)</button>
      <button class="tab" onclick="switchTab('add')">➕ הוסף נכס</button>
    </div>

    <!-- Properties List -->
    <div id="tab-properties" class="tab-content active">
      <div class="card">
        <div class="section-header">
          <div class="card-title">כל הנכסים</div>
          <input type="text" id="searchInput" placeholder="חיפוש נכס..." style="width:200px;padding:7px 12px;font-size:13px">
        </div>
        <div id="propList" class="prop-list">
          <div class="empty"><div class="empty-icon">🏢</div>אין נכסים עדיין</div>
        </div>
      </div>
    </div>

    <!-- Add Property -->
    <div id="tab-add" class="tab-content">
      <div class="card">
        <div class="card-title" id="formTitle">הוספת נכס חדש</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>שם הנכס *</label>
            <input type="text" id="f-name" placeholder="לדוג׳ מגדל שרונה 18">
          </div>
          <div class="form-group full">
            <label>כתובת *</label>
            <input type="text" id="f-address" placeholder="רחוב, עיר">
          </div>
          <div class="form-group">
            <label>שטח (מ"ר)</label>
            <input type="number" id="f-area" placeholder="300">
          </div>
          <div class="form-group">
            <label>מחיר למ"ר (₪)</label>
            <input type="number" id="f-price" placeholder="85">
          </div>
          <div class="form-group">
            <label>דמי ניהול (₪/מ"ר)</label>
            <input type="number" id="f-mgmt" placeholder="12">
          </div>
          <div class="form-group">
            <label>קומה</label>
            <input type="text" id="f-floor" placeholder="8">
          </div>
          <div class="form-group">
            <label>זמינות</label>
            <select id="f-avail">
              <option value="מיידי">מיידי</option>
              <option value="3 חודשים">3 חודשים</option>
              <option value="6 חודשים">6 חודשים</option>
              <option value="בניה">בניה</option>
            </select>
          </div>
          <div class="form-group full">
            <label>קישורי תמונות (שורה לכל תמונה)</label>
            <textarea id="f-images" placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.jpg"></textarea>
          </div>
          <div class="form-group full">
            <label>הערות</label>
            <textarea id="f-notes" placeholder="פרטים נוספים, חניות, מעלית..."></textarea>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px">
          <button class="btn btn-primary" onclick="saveProperty()">💾 שמור נכס</button>
          <button class="btn btn-ghost" onclick="clearForm()">נקה</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── RIGHT COLUMN ─── -->
  <div class="client-section">
    <!-- Client Setup -->
    <div class="card">
      <div class="card-title">👤 לקוח נוכחי</div>
      <div class="form-group" style="margin-bottom:14px">
        <label>שם הלקוח</label>
        <input type="text" id="clientName" placeholder="לדוג׳ דן כהן — אבנר פיננסים">
      </div>
      <div class="selection-counter">
        <div class="counter-num" id="selCount">0</div>
        <div>נכסים נבחרו<br><small>לחץ על נכס ברשימה לשיוך</small></div>
      </div>
    </div>

    <!-- Selected Properties -->
    <div class="card">
      <div class="card-title">נכסים משויכים ללקוח</div>
      <div id="selectedList" class="selected-list">
        <div class="empty" style="padding:20px 0"><div style="font-size:28px;margin-bottom:8px">📋</div>בחר נכסים מהרשימה</div>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn btn-green" style="flex:1" onclick="generateLink()">🔗 צור קישור ללקוח</button>
        <button class="btn btn-ghost" onclick="clearSelection()">נקה</button>
      </div>
    </div>

    <!-- Generated URL -->
    <div class="card" id="urlCard" style="display:none">
      <div class="card-title">🔗 קישור ללקוח</div>
      <div class="url-box" id="urlOutput"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-primary" style="flex:1" onclick="copyLink()">📋 העתק קישור</button>
        <button class="btn btn-ghost" onclick="openLink()">פתח ←</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ───
let properties = JSON.parse(localStorage.getItem('os_properties') || '[]');
let selectedIds = new Set();
let editingId = null;

// ─── Tabs ───
function switchTab(name) {
  document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

// ─── Render ───
function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = properties.filter(p =>
    p.name.toLowerCase().includes(search) ||
    p.address.toLowerCase().includes(search)
  );

  document.getElementById('propCount').textContent = properties.length;

  const list = document.getElementById('propList');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🏢</div>${search ? 'לא נמצאו נכסים' : 'אין נכסים עדיין'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(p => {
    const imgs = p.images || [];
    const sel = selectedIds.has(p.id);
    const avail = p.availability === 'מיידי'
      ? `<span class="badge badge-green">${p.availability}</span>`
      : `<span class="badge badge-yellow">${p.availability}</span>`;
    return `
      <div class="prop-item ${sel ? 'selected' : ''}" onclick="toggleSelect('${p.id}')">
        <div class="prop-thumb">
          ${imgs[0] ? `<img src="${imgs[0]}" onerror="this.parentElement.innerHTML='🏢'">` : '🏢'}
        </div>
        <div class="prop-info">
          <div class="prop-name">${p.name}</div>
          <div class="prop-meta">${p.address} · ${p.area ? p.area + ' מ"ר' : ''} · ${p.price ? '₪' + p.price + '/מ"ר' : ''}</div>
        </div>
        ${avail}
        <div class="prop-actions" onclick="event.stopPropagation()">
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="editProperty('${p.id}')">✏️</button>
          <button class="btn btn-danger" onclick="deleteProperty('${p.id}')">🗑</button>
        </div>
      </div>
    `;
  }).join('');

  renderSelected();
}

function renderSelected() {
  const selList = document.getElementById('selectedList');
  document.getElementById('selCount').textContent = selectedIds.size;

  if (!selectedIds.size) {
    selList.innerHTML = `<div class="empty" style="padding:20px 0"><div style="font-size:28px;margin-bottom:8px">📋</div>בחר נכסים מהרשימה</div>`;
    return;
  }

  const selProps = properties.filter(p => selectedIds.has(p.id));
  selList.innerHTML = selProps.map(p => `
    <div class="selected-item">
      <span>${p.name} <span style="color:var(--text-muted);font-size:11px">· ${p.area || '—'} מ"ר</span></span>
      <button class="remove-sel" onclick="toggleSelect('${p.id}')">×</button>
    </div>
  `).join('');
}

// ─── Toggle select ───
function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  render();
  document.getElementById('urlCard').style.display = 'none';
}

function clearSelection() {
  selectedIds.clear();
  render();
  document.getElementById('urlCard').style.display = 'none';
}

// ─── Save property ───
function saveProperty() {
  const name = document.getElementById('f-name').value.trim();
  const address = document.getElementById('f-address').value.trim();
  if (!name || !address) { showToast('⚠️ שם וכתובת הם שדות חובה'); return; }

  const imgs = document.getElementById('f-images').value
    .split('\n').map(s => s.trim()).filter(Boolean);

  const prop = {
    id: editingId || 'p_' + Date.now(),
    name,
    address,
    area: document.getElementById('f-area').value,
    price: document.getElementById('f-price').value,
    management: document.getElementById('f-mgmt').value,
    floor: document.getElementById('f-floor').value,
    availability: document.getElementById('f-avail').value,
    images: imgs,
    notes: document.getElementById('f-notes').value.trim(),
  };

  if (editingId) {
    const idx = properties.findIndex(p => p.id === editingId);
    properties[idx] = prop;
    editingId = null;
    document.getElementById('formTitle').textContent = 'הוספת נכס חדש';
  } else {
    properties.push(prop);
  }

  localStorage.setItem('os_properties', JSON.stringify(properties));
  clearForm();
  render();
  switchTab('properties');
  showToast('✅ הנכס נשמר בהצלחה');
}

function clearForm() {
  ['f-name','f-address','f-area','f-price','f-mgmt','f-floor','f-images','f-notes']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-avail').value = 'מיידי';
  editingId = null;
  document.getElementById('formTitle').textContent = 'הוספת נכס חדש';
}

function editProperty(id) {
  const p = properties.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('f-name').value = p.name;
  document.getElementById('f-address').value = p.address;
  document.getElementById('f-area').value = p.area || '';
  document.getElementById('f-price').value = p.price || '';
  document.getElementById('f-mgmt').value = p.management || '';
  document.getElementById('f-floor').value = p.floor || '';
  document.getElementById('f-avail').value = p.availability || 'מיידי';
  document.getElementById('f-images').value = (p.images || []).join('\n');
  document.getElementById('f-notes').value = p.notes || '';
  document.getElementById('formTitle').textContent = 'עריכת נכס';
  switchTab('add');
}

function deleteProperty(id) {
  if (!confirm('למחוק את הנכס?')) return;
  properties = properties.filter(p => p.id !== id);
  selectedIds.delete(id);
  localStorage.setItem('os_properties', JSON.stringify(properties));
  render();
  showToast('🗑 הנכס נמחק');
}

// ─── Generate Link ───
function generateLink() {
  if (!selectedIds.size) { showToast('⚠️ בחר לפחות נכס אחד'); return; }

  const clientName = document.getElementById('clientName').value.trim() || 'לקוח';
  const selProps = properties.filter(p => selectedIds.has(p.id));

  const payload = {
    client: clientName,
    props: selProps,
    ts: Date.now()
  };

  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const base = window.location.href.replace('admin.html', 'client.html');
  const url = `${base}?d=${encoded}`;

  document.getElementById('urlOutput').textContent = url;
  document.getElementById('urlCard').style.display = 'block';
}

function copyLink() {
  const url = document.getElementById('urlOutput').textContent;
  navigator.clipboard.writeText(url).then(() => showToast('📋 הקישור הועתק!'));
}

function openLink() {
  const url = document.getElementById('urlOutput').textContent;
  window.open(url, '_blank');
}

// ─── Toast ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Search ───
document.getElementById('searchInput').addEventListener('input', render);

// ─── Init ───
render();
</script>
</body>
</html>
